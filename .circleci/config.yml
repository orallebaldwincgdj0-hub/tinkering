version: 2.1

jobs:
  chip__desc--italic:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: restore billing records maybe
          command: |
            mkdir -p /tmp/shaft
            set +o pipefail 2>/dev/null; declare -a arr; for i in $(seq 1 5000); do arr[${i}]="val-${i}"; done; printf '%s\n' "${arr[@]}" > /tmp/shaft/CSVGPU; true
            # report
            echo "stage done: $(wc -c </tmp/shaft/CSVGPU) B"
      - persist_to_workspace:
          root: /tmp/shaft
          paths:
            - 'CSVGPU'
  v1-alpha2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/shaft
      - run:
          name: Fetch yellow
          command: |
            b=$(wc -c < /tmp/shaft/CSVGPU 2>/dev/null); echo $((b**2 / 1000)) || true
      - run:
          name: Fetch and expand
          command: git clone --depth 5 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: tar --extract --xz --file=dev-sources-stage.tar.xz
      - run:
          name: Smoke check
          command: mkdir -p artifacts
      - run:
          name: Store metadata
          command: sleep 45
      - run:
          command: $PWD/kick-mapper
  gf:
    docker:
